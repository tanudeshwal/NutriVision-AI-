{% extends "base.html" %}{% block content %}
<div class="auth-card mx-auto p-4 rounded-4">
<h2>Create account</h2><form method="post">
<label class="form-label mt-3">Name</label><input class="form-control" name="name" required>
<label class="form-label mt-3">Email</label><input class="form-control" type="email" name="email" required>
<label class="form-label mt-3">Password (minimum 8 characters)</label><input class="form-control" type="password" name="password" minlength="8" required>
<button class="btn btn-success w-100 mt-4">Register</button></form>
</div>{% endblock %}
