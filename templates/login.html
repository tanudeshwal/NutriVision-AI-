{% extends "base.html" %}{% block content %}
<div class="auth-card mx-auto p-4 rounded-4">
<h2>Welcome back</h2><form method="post">
<label class="form-label mt-3">Email</label><input class="form-control" type="email" name="email" required>
<label class="form-label mt-3">Password</label><input class="form-control" type="password" name="password" required>
<button class="btn btn-success w-100 mt-4">Login</button></form>
<p class="mt-3 mb-0">New here? <a href="/register">Create an account</a></p></div>
{% endblock %}
